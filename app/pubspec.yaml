name: atelier_couture
description: Gestion d'ateliers de couture (multi-ateliers) - stock, coupe, devis, factures, rendez-vous.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: any
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^8.1.0
  alarm: '>=4.1.0 <5.0.0'
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
